<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; cursor: none; }
  html, body { overflow: hidden; background: transparent; width: 100%; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const P = {
  stickLength:   300,   // px
  stickWidth:    26,    // px
  edgeMargin:    100,    // distance of the first stick from the screen edge
  stickSpacing:  110,   // x gap between sticks on the same edge
  waveAmp:       0.2,   // idle wave (radians)
  waveSpeed:     0.0022,// idle wave (radians per ms)
  leanByMouseX:  0.012, // lean (radians) per px of horizontal mouse speed
  leanClamp:     0.7,
  leanSmooth:    0.15,
  bandRollAxes:  ['ax', 'az'], // roll = atan2(first, second) of the wrist gravity vector; swap/negate if the sticks lean the wrong way
  bandRollSign:  1,     // -1 mirrors the lean
  bandRollClamp: 1.2,   // radians
  bandSmooth:    0.2,
  bandWaveAmp:   0.04,  // idle wave while the band is live
  bandShakeDps:  400,   // wrist gyro (deg/s) that counts as a shake
  bandLiveMs:    1000,  // band is live while its last sample is younger than this
  crackSpeed:    60,    // mouse px/frame to trigger crack
  crackCooldownMs: 200,
  firstCrackGraceMs: 350,
  fallMs:        600,
  frenzyCheers:  3,     // cheers within frenzyWindowMs start frenzy
  frenzyWindowMs: 2000,
  frenzyMs:      4000,
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

let mouseX = 0, mouseY = 0;
let prevMouseX = 0;
let sticks = null;
let dropping = false, dropStart = 0;
let lastCrackTime = 0;
let spawnTime = 0;
let lean = 0;
let bandAt = 0, bandTarget = 0, bandRoll = 0, bandGyro = 0;
const bandLive = now => now - bandAt < P.bandLiveMs;

let lastFrame = Date.now(), wavePhase = 0, hueOff = 0, fz = 0, frenzyUntil = 0, cheers = [];

document.addEventListener('mousemove', e => { mouseX = e.clientX; });

function startDrop() {
  if (sticks && !dropping) { dropping = true; dropStart = Date.now(); }
}

// Three sticks per screen edge, bases in the lower half, fanned slightly.
function spawnSticks() {
  dropping = false;
  lastCrackTime = 0;
  spawnTime = Date.now();
  const out = [];
  for (let side = 0; side < 2; side++) {
    for (let k = 0; k < 3; k++) {
      const i = side * 3 + k;
      const x = side ? W - P.edgeMargin - k * P.stickSpacing : P.edgeMargin + k * P.stickSpacing;
      out.push({
        x, y: H * (0.7 + 0.08 * k),
        tilt: (k - 1) * 0.15,
        hue: i * 60 + 300,
        phase: i * 1.1,
      });
    }
  }
  return out;
}

// ── Synth sound (Web Audio, no files). Never throws. ────────────────────────
let actx = null;
function audio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!actx && AC) actx = new AC();
    if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
    return actx;
  } catch { return null; }
}

function tone(a, freq, at, dur, vol, type = 'sine') {
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(vol, at + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(a.destination);
  o.start(at);
  o.stop(at + dur + 0.02);
}

function sfx(fn) {
  try { const a = audio(); if (a) fn(a, a.currentTime); } catch {}
}

// Bright rising chime.
const playChime = () => sfx((a, t) => {
  tone(a, 880, t, 0.25, 0.12);
  tone(a, 1318.5, t + 0.07, 0.3, 0.12);
  tone(a, 1760, t + 0.14, 0.4, 0.1, 'triangle');
});

// Soft swoosh: band-passed noise sweeping upward.
const playSwoosh = () => sfx((a, t) => {
  const n = Math.floor(a.sampleRate * 0.4), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf;
  f.type = 'bandpass';
  f.frequency.setValueAtTime(300, t);
  f.frequency.exponentialRampToValueAtTime(2500, t + 0.35);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.18, t + 0.12);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
  src.connect(f).connect(g).connect(a.destination);
  src.start(t);
});

// Louder sparkle arpeggio when frenzy starts.
const playFanfare = () => sfx((a, t) => {
  [784, 988, 1175, 1568, 1976, 2349, 3136].forEach((f, i) => tone(a, f, t + i * 0.06, 0.45, 0.2, 'triangle'));
  tone(a, 523, t, 0.9, 0.18, 'square');
});

function update() {
  if (!sticks) return;
  const mvx = mouseX - prevMouseX;
  prevMouseX = mouseX;
  const target = Math.max(-P.leanClamp, Math.min(P.leanClamp, mvx * P.leanByMouseX));
  lean += (target - lean) * P.leanSmooth;

  const now = Date.now();
  const dt = Math.min(50, now - lastFrame);
  lastFrame = now;
  if (frenzyUntil && now > frenzyUntil) frenzyUntil = 0;
  fz += ((frenzyUntil ? 1 : 0) - fz) * 0.08;
  wavePhase += dt * P.waveSpeed * (1 + 1.5 * fz);
  if (fz > 0.01) hueOff = (hueOff + dt * 0.25) % 360; else hueOff = 0;

  const live = bandLive(now);
  bandRoll += (bandTarget - bandRoll) * P.bandSmooth;
  const shake = live && bandGyro > P.bandShakeDps;
  bandGyro = 0;
  if (!dropping && (live ? shake : Math.hypot(mvx) > P.crackSpeed) &&
      now - spawnTime >= P.firstCrackGraceMs && now - lastCrackTime > P.crackCooldownMs) {
    lastCrackTime = now;
    cheers = cheers.filter(c => now - c < P.frenzyWindowMs);
    cheers.push(now);
    if (cheers.length >= P.frenzyCheers && !frenzyUntil) {
      frenzyUntil = now + P.frenzyMs;
      cheers = [];
      playFanfare();
    } else {
      playChime();
    }
    window.bridge.whipCrack();
  }

  if (dropping && now - dropStart > P.fallMs) {
    sticks = null;
    dropping = false;
    window.bridge.hideOverlay();
  }
}

// A rigid cylinder pointing up from its base, rotated by `a` around the base.
function drawStick(s, a, alpha, fall) {
  const L = P.stickLength, w = P.stickWidth, h = `hsl(${(s.hue + hueOff) % 360}`;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(s.x, s.y + fall);
  ctx.rotate(a);
  const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
  g.addColorStop(0, `${h},100%,25%)`);
  g.addColorStop(0.3, `${h},100%,60%)`);
  g.addColorStop(0.5, `${h},100%,85%)`);
  g.addColorStop(0.75, `${h},100%,55%)`);
  g.addColorStop(1, `${h},100%,22%)`);
  ctx.shadowColor = `${h},100%,60%)`;
  ctx.shadowBlur = 28 + 30 * fz;
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.roundRect(-w / 2, -L, w, L, w / 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = `${h},60%,14%)`; // darker grip at the base
  ctx.beginPath();
  ctx.roundRect(-w / 2, -L * 0.18, w, L * 0.18, w / 2);
  ctx.fill();
  ctx.fillStyle = 'hsla(0,0%,100%,0.85)'; // thin highlight
  ctx.beginPath();
  ctx.roundRect(-w * 0.28, -L + w * 0.6, w * 0.1, L * 0.7, w * 0.05);
  ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  if (!sticks) return;

  const now = Date.now();
  const t = dropping ? Math.min(1, (now - dropStart) / P.fallMs) : 0;
  if (fz > 0.01) drawEdgeGlow(now, (1 - t) * fz);
  for (const s of sticks) {
    const live = bandLive(now);
    const a = s.tilt + (live ? P.bandWaveAmp : P.waveAmp * (1 + 0.6 * fz)) * Math.sin(wavePhase + s.phase) + (live ? bandRoll : lean);
    drawStick(s, a, 1 - t, t * t * 500);
  }
}

// Soft rainbow glow pulsing at the left and right screen edges.
function drawEdgeGlow(now, k) {
  const pulse = 0.65 + 0.35 * Math.sin(now * 0.012);
  const gw = 260;
  for (let side = 0; side < 2; side++) {
    const x0 = side ? W : 0, x1 = side ? W - gw : gw;
    const g = ctx.createLinearGradient(x0, 0, x1, 0);
    const hue = hueOff + side * 180;
    g.addColorStop(0, `hsla(${hue},100%,60%,${0.45 * pulse * k})`);
    g.addColorStop(1, `hsla(${hue},100%,60%,0)`);
    ctx.fillStyle = g;
    ctx.fillRect(Math.min(x0, x1), 0, gw, H);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

// ── IPC from main process ───────────────────────────────────────────────────
window.bridge.onSpawnWhip(() => {
  sticks = spawnSticks();
  prevMouseX = mouseX;
  lean = 0;
  frenzyUntil = 0; cheers = []; fz = 0;
  playSwoosh();
});

window.bridge.onDropWhip(startDrop);

window.bridge.onBand(m => {
  const [a, b] = P.bandRollAxes;
  const r = P.bandRollSign * Math.atan2(m[a], m[b]);
  bandTarget = Math.max(-P.bandRollClamp, Math.min(P.bandRollClamp, r));
  bandGyro = Math.max(bandGyro, m.gyro);
  bandAt = Date.now();
});

</script>
</body>
</html>
