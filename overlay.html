<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; cursor: none; }
  html, body { overflow: hidden; background: transparent; width: 100%; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const P = {
  wandLength:    0.36,  // hand to tip, as a share of the screen height
  wandWidth:     0.075, // stick width at the hand, as a share of the screen height
  wandTaper:     0.8,   // tip width / grip width at rest: the tip is farther from the viewer
  wandInset:     0.17,  // hand x from the screen edge, as a share of the screen width
  wandTilt:      0.13,  // inward tilt at rest (radians)
  waveAmp:       0.2,   // idle wave (radians)
  waveSpeed:     0.0022,// idle wave (radians per ms)
  leanByMouseX:  0.012, // lean (radians) per px of horizontal mouse speed
  leanClamp:     0.7,
  leanSmooth:    0.15,
  bandLeanAxis:  'ax',   // band axis that points sideways while the hand holds a stick: its share of gravity is the lean. 'ay' or 'az' for a band worn another way
  bandRollSign:  1,     // -1 mirrors the lean
  bandGyroSign:  1,     // -1 if the sticks first move the wrong way on a turn; 0 uses the accelerometer only
  bandRollClamp: 1.2,   // radians
  bandPitchSign: 1,     // -1 if the sticks swing back when the hand swings forward
  bandPitchReturnMs: 250, // forward/back swing decays to upright with this time constant
  bandPitchClamp: 1.2,  // radians
  bandGravityTau: 0.04, // seconds: how fast the accelerometer corrects the gyro
  bandAccelTrust: 0.15, // the accelerometer corrects only while it reads within this of 1 g
  bandHoldDps:   200,   // wrist gyro magnitude (deg/s) above which the lean holds still, so a shake does not swing the sticks
  bandSmoothMs:  30,    // display smoothing between band frames
  bandWaveAmp:   0.04,  // idle wave while the band is live
  bandShakeDps:  600,   // wrist gyro magnitude (deg/s) that starts a shake
  bandShakeEndDps: 250, // a shake ends when the gyro stays below this ...
  bandShakeQuietMs: 120, // ... for this long; only then can the next shake start
  bandLiveMs:    3000,  // band is live while its last sample is younger than this
  cheerPumpPx:   40,    // a cheer pushes the sticks up along their axis by this much, then they settle
  crackSpeed:    60,    // mouse px/frame to trigger crack
  crackCooldownMs: 200,
  cheerCooldownMs: 3000, // after a typed cheer, no further typed cheer for this long
  firstCrackGraceMs: 350,
  fallMs:        600,
  frenzyMs:      4000,
  auraScale:     3,     // wand aura radius, in tube half-widths (rest)
  auraAlpha:     0.45,  // aura strength at rest
  motes:         10,    // drifting light motes per wand
  moteSpeed:     0.00007,// mote rise speed (share of the tube per ms)
  edgeBase:      0.25,  // screen-edge glow at rest, as a share of the frenzy level
  swingDps:      300,   // wrist gyro speed that counts as one swing stroke (deg/s)
  swingEndDps:   120,   // a stroke ends below this (deg/s)
  swingFullDps:  1000,  // gyro speed that gives full-size swing feedback (deg/s)
  swingMousePx:  30,    // mouse px/frame that counts as a swing stroke
  swingSparks:   40,    // sparks per wand in the burst of a full swing
  sparkMax:      160,   // most sparks alive at once
  trailMs:       250,   // swing trail fade time constant (ms)
  trailFan:      8,     // ghost copies in the swing trail
  trailStep:     0.035, // angle between ghost copies at full energy (rad)
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, dpr;

// Backing store in device pixels (2x at most), drawing in CSS pixels: sharp on Retina.
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

let mouseX = 0, mouseY = 0;
let prevMouseX = 0;
let shown = false;
let dropping = false, dropStart = 0;
let lastCheerTyped = -Infinity;
let lastCrackTime = 0;
let spawnTime = 0;
let lean = 0, sparkles = true;
let bandAt = 0, bandG = null, bandAngle = 0, bandRoll = 0, bandShake = false, shaking = false, quietMs = 0, pump = 0, pitch = 0;
let swings = [], swingDir0 = 0, swingDir = 1, swingSpeed = 0, trailE = 0, swingCount = 0, mouseArmed = true, sparks = [], sparkDebt = 0;
const AXIS = { ax: 0, ay: 1, az: 2 };

// One band sample, dt seconds after the last one.
function bandSample(m, dt) {
  const acc = [m.ax, m.ay, m.az], dps = Math.hypot(m.gx, m.gy, m.gz);
  if (dps > P.bandShakeDps && !shaking) bandShake = shaking = true;
  quietMs = dps < P.bandShakeEndDps ? quietMs + dt * 1000 : 0;
  if (quietMs >= P.bandShakeQuietMs) shaking = false;
  // Forward/back swing: gyro about the sideways axis, kept during shakes; update() decays it so it cannot drift.
  const gs = [m.gx, m.gy, m.gz][AXIS[P.bandLeanAxis]];
  pitch = Math.max(-P.bandPitchClamp, Math.min(P.bandPitchClamp, pitch + P.bandPitchSign * gs * dt * Math.PI / 180));
  // Swing strokes: one per forward or back stroke (gyro about the sideways axis), whatever the cheer cooldown says.
  const sg = gs * P.bandPitchSign, ag = Math.abs(sg);
  swingSpeed = Math.max(swingSpeed, Math.min(1, ag / P.swingFullDps));
  if (swingDir0 && ag < P.swingEndDps) swingDir0 = 0;
  else if (ag > P.swingDps && Math.sign(sg) !== swingDir0) { swingDir0 = Math.sign(sg); swings.push([swingDir0, Math.min(1, ag / P.swingFullDps)]); }
  // Fast motion must not reach the lean: hold the last slow orientation until the wrist is slow again.
  if (shaking || dps > P.bandHoldDps) return;

  // Complementary filter on the gravity vector (band axes): the gyro turns the estimate,
  // the accelerometer pulls it back, so it is fast and does not drift.
  const k = P.bandGyroSign * dt * Math.PI / 180, wx = m.gx * k, wy = m.gy * k, wz = m.gz * k;
  const [x, y, z] = bandG || acc;
  bandG = [x + y * wz - z * wy, y + z * wx - x * wz, z + x * wy - y * wx];
  if (Math.abs(Math.hypot(...acc) - 1) < P.bandAccelTrust) {
    const f = dt / (P.bandGravityTau + dt);
    bandG = bandG.map((v, i) => v + (acc[i] - v) * f);
  }
  const n = Math.hypot(...bandG) || 1;
  bandG = bandG.map(v => v / n);
  // asin of one axis: zero when that axis is level, and no +-180 degree wrap to jump at.
  bandAngle = P.bandRollSign * Math.asin(Math.max(-1, Math.min(1, bandG[AXIS[P.bandLeanAxis]])));
}
const bandLive = now => now - bandAt < P.bandLiveMs;

let lastFrame = Date.now(), wavePhase = 0, hueOff = 0, fz = 0, frenzyUntil = 0;

document.addEventListener('mousemove', e => { mouseX = e.clientX; });

function startDrop() {
  if (shown && !dropping) { dropping = true; dropStart = Date.now(); }
}

// ── Synth sound (Web Audio, no files). Never throws. ────────────────────────
let actx = null;
function audio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!actx && AC) actx = new AC();
    if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
    return actx;
  } catch { return null; }
}

function tone(a, freq, at, dur, vol, type = 'sine') {
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(vol, at + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(a.destination);
  o.start(at);
  o.stop(at + dur + 0.02);
}

function sfx(fn) {
  try { const a = audio(); if (a) fn(a, a.currentTime); } catch {}
}

// Bright rising chime.
const playChime = () => sfx((a, t) => {
  tone(a, 880, t, 0.25, 0.12);
  tone(a, 1318.5, t + 0.07, 0.3, 0.12);
  tone(a, 1760, t + 0.14, 0.4, 0.1, 'triangle');
});

// Soft swoosh: band-passed noise sweeping upward.
const playSwoosh = () => sfx((a, t) => {
  const n = Math.floor(a.sampleRate * 0.4), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf;
  f.type = 'bandpass';
  f.frequency.setValueAtTime(300, t);
  f.frequency.exponentialRampToValueAtTime(2500, t + 0.35);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.18, t + 0.12);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
  src.connect(f).connect(g).connect(a.destination);
  src.start(t);
});

// Louder sparkle arpeggio when frenzy starts.
const playFanfare = () => sfx((a, t) => {
  [784, 988, 1175, 1568, 1976, 2349, 3136].forEach((f, i) => tone(a, f, t + i * 0.06, 0.45, 0.2, 'triangle'));
  tone(a, 523, t, 0.9, 0.18, 'square');
});

// Types one cheer unless the cooldown is running; returns whether it did.
function typeCheer(now) {
  if (now - lastCheerTyped < P.cheerCooldownMs) return false;
  lastCheerTyped = now;
  frenzyUntil = now + P.frenzyMs; // every typed cheer starts frenzy
  playFanfare();
  window.bridge.whipCrack();
  return true;
}

function update() {
  if (!shown) return;
  const mvx = mouseX - prevMouseX;
  prevMouseX = mouseX;
  const target = Math.max(-P.leanClamp, Math.min(P.leanClamp, mvx * P.leanByMouseX));
  lean += (target - lean) * P.leanSmooth;

  const now = Date.now();
  const dt = Math.min(50, now - lastFrame);
  lastFrame = now;
  if (frenzyUntil && now > frenzyUntil) frenzyUntil = 0;
  fz += ((frenzyUntil ? 1 : 0) - fz) * 0.08;
  wavePhase += dt * P.waveSpeed * (1 + 1.5 * fz);
  if (fz > 0.01) hueOff = (hueOff + dt * 0.25) % 360; else hueOff = 0;

  const live = bandLive(now);
  const clamped = Math.max(-P.bandRollClamp, Math.min(P.bandRollClamp, bandAngle));
  bandRoll += (clamped - bandRoll) * (1 - Math.exp(-dt / P.bandSmoothMs));
  pump *= Math.exp(-dt / 120);
  pitch *= Math.exp(-dt / P.bandPitchReturnMs);
  // A shake that never goes quiet counts again once the cheer cooldown has passed.
  const shake = live && (bandShake || (shaking && now - lastCheerTyped >= P.cheerCooldownMs));
  bandShake = false;
  if (!dropping && (live ? shake : Math.hypot(mvx) > P.crackSpeed) &&
      now - spawnTime >= P.firstCrackGraceMs && now - lastCrackTime > P.crackCooldownMs) {
    lastCrackTime = now;
    if (!live) pump = 1; // with the band, the forward/back swing replaces the pump
    if (!typeCheer(now)) playChime();
  }

  // Swing feedback, independent of the cheer logic above.
  const mouseSpeed = Math.abs(mvx);
  if (!live && !dropping) {
    if (mouseArmed && mouseSpeed > P.swingMousePx) {
      mouseArmed = false;
      swings.push([Math.sign(mvx), Math.min(1, mouseSpeed / (P.swingMousePx * 4)), mouseSpeed]);
    } else if (mouseSpeed < P.swingMousePx * 0.4) mouseArmed = true;
  }
  for (const [dir, power] of swings) if (!dropping) fireSwing(dir, power, now, live);
  swings.length = 0;
  const speed = live ? swingSpeed : Math.min(1, mouseSpeed / (P.swingMousePx * 4));
  trailE = Math.max(trailE * Math.exp(-dt / P.trailMs), dropping ? 0 : speed);
  swingSpeed *= Math.exp(-dt / 60);
  if (speed > 0.15 && !dropping) { // sparks keep flowing while the stroke is fast
    const L = P.wandLength * H * Math.cos(pitch);
    sparkDebt += dt * 0.06 * speed;
    const n = Math.floor(sparkDebt); sparkDebt -= n;
    for (let side = 0; side < 2 && n; side++) emitSparks(side, angleOf(side, live), L, n, speed);
  }
  for (const s of sparks) { s.age += dt; s.x += s.vx * dt / 1000; s.y += s.vy * dt / 1000; s.vy += 300 * dt / 1000; s.vx *= 0.985; }
  sparks = sparks.filter(s => s.age < s.life);

  if (dropping && now - dropStart > P.fallMs) {
    shown = false;
    dropping = false;
    window.bridge.hideOverlay();
  }
}

// Wand angle for one side.
function angleOf(side, live) {
  return (side ? -1 : 1) * P.wandTilt + (live ? P.bandWaveAmp : P.waveAmp * (1 + 0.6 * fz)) * Math.sin(wavePhase + side * 1.1) + (live ? bandRoll : lean);
}

// One swing, any wand: remember its direction, light the trail and burst sparks from both tips.
function fireSwing(dir, power, now, live) {
  swingCount++;
  swingDir = dir || swingDir;
  trailE = Math.max(trailE, 0.5 + 0.5 * power);
  for (let side = 0; side < 2; side++) {
    const a = angleOf(side, live), L = P.wandLength * H * Math.cos(pitch);
    emitSparks(side, a, L, Math.floor(P.swingSparks * (0.4 + 0.6 * power)), power);
  }
}

function emitSparks(side, a, L, n, power) {
  const x = W * (side ? 1 - P.wandInset : P.wandInset) + Math.sin(a) * L, y = H - Math.cos(a) * L;
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * 2 * Math.PI, v = (120 + 520 * power) * (0.3 + Math.random()) * H / 1169;
    if (sparks.length >= P.sparkMax) sparks.shift();
    sparks.push({ x, y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v - 60, age: 0, life: 350 + Math.random() * 450,
      hue: ((side ? 190 : 320) + hueOff + Math.random() * 40 - 20) % 360, size: (3 + Math.random() * 4) * H / 1169 * (1 + power) });
  }
}

// One hand-held wand in first-person view: the hand is at the bottom screen edge, the tip is far.
// Rotated by `a` around the hand. Local y runs from 0 (hand) to -L (tip).
function drawWand(side, a, alpha, fall) {
  const sp = Math.sin(pitch); // > 0: tip toward the viewer
  const L = P.wandLength * H * Math.cos(pitch), w0 = P.wandWidth * H;
  let w1 = w0 * P.wandTaper * Math.exp(0.9 * sp); // perspective cue: the tip grows toward the viewer and shrinks away
  if (Math.abs(w0 - w1) < 1) w1 = w0 - 1; // the edges must meet somewhere, see across()
  const G = 0.06, T = 0.9; // end cap share of the length, tube share of the width
  const h = `hsl(${((side ? 190 : 320) + hueOff) % 360}`, white = a => `hsla(0,0%,100%,${a})`;
  const hw = u => (w0 + (w1 - w0) * u) / 2;
  // Rings round the wand show as curves: seen from above near the hand, from below near the tip.
  const sag = u => 0.45 - 0.7 * u + 0.4 * sp;
  // Path of the body from u0 to u1 (0 hand, 1 tip) at share f of the width; `dome` rounds the far end.
  const body = (u0, u1, f, dome) => {
    const r0 = hw(u0) * f, r1 = hw(u1) * f, y0 = -u0 * L, y1 = -u1 * L;
    ctx.beginPath();
    ctx.moveTo(-r0, y0);
    ctx.lineTo(-r1, y1);
    if (dome) ctx.arc(0, y1, r1, Math.PI, 0); else ctx.quadraticCurveTo(0, y1 + 2 * r1 * sag(u1), r1, y1);
    ctx.lineTo(r0, y0);
    ctx.quadraticCurveTo(0, y0 + 2 * r0 * sag(u0), -r0, y0);
  };
  // Shading across the width (t: 0 left, 1 right) that narrows with the taper:
  // a conic gradient whose centre is the point where the two edges meet.
  // Keep each list at 6 stops or fewer, so the GPU computes the gradient and does not sample a coarse texture.
  const apex = -L * w0 / (w0 - w1), up = apex < 0;
  const across = (f, stops) => {
    const th = Math.atan(f * w0 / 2 / Math.abs(apex));
    const g = ctx.createConicGradient((up ? 1 : -1) * Math.PI / 2 - th, 0, apex);
    for (const [t, c] of stops) g.addColorStop((up ? 1 - t : t) * th / Math.PI, c);
    return g;
  };
  const fill = (style, ...path) => { body(...path); ctx.fillStyle = style; ctx.fill(); };

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W * (side ? 1 - P.wandInset : P.wandInset), H + fall);
  ctx.rotate(a);
  ctx.translate(0, -P.cheerPumpPx * pump);

  // Soft outer glow: a capsule round the tube, the light falls off with the distance from the axis.
  // Gradients, not shadowBlur: cheaper, and the blur shows a faint box on a dark screen.
  const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.0018 + side * 2);
  const K = T * (P.auraScale + 1.6 * fz + 0.6 * pulse), lit = a => `${h},100%,60%,${a * (P.auraAlpha + 0.1 * pulse + 0.25 * fz)})`;
  ctx.fillStyle = across(K, [[0, lit(0)], [0.25, lit(0.25)], [0.5, lit(1)], [0.75, lit(0.25)], [1, lit(0)]]);
  ctx.beginPath();
  for (const [u, f] of [[G, -K], [1, -K], [1, K], [G, K]]) ctx.lineTo(hw(u) * f, -u * L);
  ctx.fill();
  for (const u of [G, 1]) { // round ends
    const R = hw(u) * K, g = ctx.createRadialGradient(0, -u * L, 0, 0, -u * L, R);
    g.addColorStop(0, lit(1)); g.addColorStop(0.5, lit(0.25)); g.addColorStop(1, lit(0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, -u * L, R, u < 1 ? 0 : Math.PI, u < 1 ? Math.PI : 0);
    ctx.fill();
  }
  // Swing trail: ghost copies of the tube fan out behind the stroke, fading with the swing energy.
  if (trailE > 0.03) {
    ctx.globalCompositeOperation = 'lighter';
    for (let k = 1; k <= P.trailFan; k++) {
      ctx.save();
      ctx.rotate(swingDir * k * P.trailStep * Math.min(1, trailE + 0.3));
      fill(`${h},100%,70%,${0.45 * trailE * (1 - k / (P.trailFan + 1))})`, G, 1, T * 1.15, true);
      ctx.restore();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  // Translucent plastic tube, one colour along its length, slightly darker at the rims.
  fill(across(T, [[0, `${h},90%,40%,0.95)`], [0.12, `${h},90%,55%,0.9)`], [0.5, `${h},90%,64%,0.85)`],
    [0.88, `${h},90%,52%,0.9)`], [1, `${h},90%,38%,0.95)`]]), G - 0.02, 1, T, true);
  // Soft inner glow: a wide, faint halo of the same colour.
  fill(across(T * 0.7, [[0, `${h},100%,70%,0)`], [0.5, `${h},100%,74%,0.5)`], [1, `${h},100%,70%,0)`]]), G - 0.02, 0.97, T * 0.7, true);
  // Faint plastic sheen on the left of the tube.
  const sg = ctx.createLinearGradient(0, -G * L, 0, -L);
  sg.addColorStop(0.05, white(0)); sg.addColorStop(0.2, white(0.3)); sg.addColorStop(0.8, white(0.2)); sg.addColorStop(0.95, white(0));
  ctx.fillStyle = sg;
  ctx.beginPath();
  for (const [u, f] of [[G, -0.7], [0.95, -0.7], [0.95, -0.52], [G, -0.52]]) ctx.lineTo(hw(u) * T * f, -u * L);
  ctx.fill();

  // End cap: a small plastic plug in a darker shade of the tube colour.
  fill(across(T, [[0, `${h},70%,22%)`], [0.25, `${h},60%,40%)`], [0.55, `${h},60%,32%)`], [1, `${h},70%,18%)`]]), -0.12, G, T * 1.04);
  // Sparkle dots drifting up along the tube.
  const now = Date.now(), px = H / 1169;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < (sparkles ? P.motes : 0); i++) {
    const u = (i / P.motes + now * P.moteSpeed * (0.7 + (i % 3) * 0.3)) % 1, uu = G + (1.1 - G) * u;
    const x = Math.sin(now * 0.0016 * (1 + (i % 4) * 0.3) + i * 2.1) * hw(Math.min(uu, 1)) * T * (1.6 + (i % 5) * 0.6);
    const y = -uu * L, fade = Math.sin(Math.PI * u), rr = (2 + (i % 3)) * px * 1.6;
    ctx.fillStyle = `${h},100%,80%,${0.2 * fade})`;
    ctx.beginPath(); ctx.arc(x, y, rr * 3, 0, 7); ctx.fill();
    ctx.fillStyle = `${h},100%,92%,${0.9 * fade})`;
    ctx.beginPath(); ctx.arc(x, y, rr, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();

}

function draw() {
  ctx.clearRect(0, 0, W, H);
  if (!shown) return;

  const now = Date.now();
  const t = dropping ? Math.min(1, (now - dropStart) / P.fallMs) : 0;
  drawEdgeGlow(now, (1 - t) * (P.edgeBase + (1 - P.edgeBase) * fz));
  const live = bandLive(now);
  for (let side = 0; side < 2; side++) drawWand(side, angleOf(side, live), 1 - t, t * t * 500);
  drawSparks();
}

function drawSparks() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const s of sparks) {
    const k = 1 - s.age / s.life;
    ctx.strokeStyle = `hsla(${s.hue},100%,${60 + 30 * k}%,${k})`;
    ctx.lineWidth = s.size * (0.4 + k);
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - s.vx * 0.03, s.y - s.vy * 0.03);
    ctx.stroke();
  }
  ctx.restore();
}

// Soft rainbow glow at the left and right screen edges: low at rest, strong in frenzy.
function drawEdgeGlow(now, k) {
  const pulse = 0.65 + 0.35 * Math.sin(now * (0.0025 + 0.0095 * fz));
  const gw = Math.max(260, W * 0.1);
  for (let side = 0; side < 2; side++) {
    const x0 = side ? W : 0, x1 = side ? W - gw : gw;
    const g = ctx.createLinearGradient(x0, 0, x1, 0);
    const hue = (side ? 190 : 320) + hueOff;
    g.addColorStop(0, `hsla(${hue},100%,60%,${0.45 * pulse * k})`);
    g.addColorStop(1, `hsla(${hue},100%,60%,0)`);
    ctx.fillStyle = g;
    ctx.fillRect(Math.min(x0, x1), 0, gw, H);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

// ── IPC from main process ───────────────────────────────────────────────────
window.bridge.onSpawnWhip(() => {
  shown = true;
  dropping = false;
  lastCrackTime = 0;
  spawnTime = Date.now();
  prevMouseX = mouseX;
  lean = 0;
  frenzyUntil = 0; fz = 0;
  playSwoosh();
});

window.bridge.onDropWhip(startDrop);
window.bridge.onSparkles(on => { sparkles = on; });
window.bridge.onVoice(() => { if (!dropping) typeCheer(Date.now()); }); // voice cheer: same cooldown and frenzy

window.bridge.onBand(f => {
  for (const m of f.samples) bandSample(m, f.dt);
  bandAt = Date.now();
});

</script>
</body>
